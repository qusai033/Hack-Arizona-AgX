name: Specification evaluation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  specification:
    name: Evaluate canonical handoff
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:spec
      - name: Preserve evaluation evidence, including failures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: specification-evaluation
          path: |
            spec-report/
            test-results/spec/
          retention-days: 7
